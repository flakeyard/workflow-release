name: Rerun the run of the release commit
description: >-
  Reruns the push run of a release's commit when this run created the release,
  so that the run at the release commit publishes it.
inputs:
  tag:
    description: Tag of the release.
    required: true
  sha:
    description: Commit of the release.
    required: true
  created:
    description: "'true' when release-please reported creating it in this run."
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ github.ref_name }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.sha }}
        CREATED: ${{ inputs.created }}
      run: '"$GITHUB_ACTION_PATH/rerun-release-commit.sh"'
