name: Release scope
description: >-
  Fails unless release-please, which releases every merged pull request
  labelled "autorelease: pending" that it finds at the head of the branch,
  releases only pull requests merged at or before the run's commit, with the
  configuration and the manifest of that commit.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  token:
    required: true
  config-file:
    required: true
  manifest-file:
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        CONFIG: ${{ inputs.config-file }}
        MANIFEST: ${{ inputs.manifest-file }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" release-scope GH_TOKEN REPO BASE SHA
        CONFIG MANIFEST GITHUB_STEP_SUMMARY
