name: Check the release-please configuration
description: Fails unless the configuration has one root package tagged vX.Y.Z.
inputs:
  token:
    required: true
  config-file:
    required: true
  manifest-file:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        CONFIG: ${{ inputs.config-file }}
        MANIFEST: ${{ inputs.manifest-file }}
      run: '"$GITHUB_ACTION_PATH/check-config.sh"'
