name: Start checks on the release pull request
description: >-
  Starts a check workflow with workflow_dispatch on the open release pull
  request, whose checks do not start when GITHUB_TOKEN opened it.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  check-workflow:
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        BASE: ${{ github.ref_name }}
        WORKFLOW: ${{ inputs.check-workflow }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" dispatch-checks GH_TOKEN REPO OWNER
        BASE WORKFLOW GITHUB_STEP_SUMMARY
