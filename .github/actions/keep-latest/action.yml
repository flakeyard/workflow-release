name: Keep the newest release latest
description: Marks the newest published vX.Y.Z as latest, also after a release from release/vN.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  token:
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" keep-latest GH_TOKEN REPO
        GITHUB_STEP_SUMMARY
