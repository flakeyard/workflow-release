name: Preflight
description: >-
  Fails before anything is written unless the run is a push to a release
  branch, the App inputs are complete where the key is visible, and the
  release-please configuration is supported.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  app-client-id:
    description: Client ID of the App, or empty.
    required: true
  has-key:
    description: "'true' when APP_PRIVATE_KEY was passed."
    required: true
  key-visible:
    description: >-
      'false' when APP_PRIVATE_KEY may be a secret of an environment that this
      job does not use, so that has-key says nothing.
    default: "true"
  config-file:
    required: true
  manifest-file:
    required: true
outputs:
  skip:
    description: "'true' when the push is to release/v0, where nothing is released."
    value: ${{ steps.run.outputs.skip }}
runs:
  using: composite
  steps:
    - id: run
      name: Check the run
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        CLIENT_ID: ${{ inputs.app-client-id }}
        HAS_KEY: ${{ inputs.has-key }}
        KEY_VISIBLE: ${{ inputs.key-visible }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" inputs CLIENT_ID HAS_KEY KEY_VISIBLE
        EVENT REF DEFAULT_BRANCH GITHUB_OUTPUT
    - name: Check the release-please configuration
      if: ${{ steps.run.outputs.skip != 'true' }}
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        REF: ${{ github.ref }}
        CONFIG: ${{ inputs.config-file }}
        MANIFEST: ${{ inputs.manifest-file }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" config GH_TOKEN REPO SHA REF CONFIG
        MANIFEST
