name: Reconcile pending release pull requests
description: >-
  Relabels merged release pull requests left "autorelease: pending" as tagged
  when their release exists. release-please cannot do it after a failed run,
  because recreating an immutable release is refused.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  token:
    required: true
  manifest-file:
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.ref_name }}
        MANIFEST: ${{ inputs.manifest-file }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" reconcile-pending-prs GH_TOKEN REPO
        BASE MANIFEST GITHUB_STEP_SUMMARY
