name: Token
description: >-
  Creates a token of the App given by its client ID, limited to this
  repository and to contents, issues, pull requests and workflows; without an
  App, it returns GITHUB_TOKEN. Fails when only one of the client ID and the
  key is given.
inputs:
  shell-lib:
    description: >-
      Directory of action-shell-lib: the output path of its step in the job,
      whose modules the scripts source.
    required: true
  app-client-id:
    description: Client ID of the App, or empty.
    default: ""
  private-key:
    description: Private key of the App.
    default: ""
outputs:
  token:
    value: ${{ steps.app.outputs.token || github.token }}
runs:
  using: composite
  steps:
    - name: Check the App inputs
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        CLIENT_ID: ${{ inputs.app-client-id }}
        HAS_KEY: ${{ inputs.private-key != '' }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" token CLIENT_ID HAS_KEY
    - id: app
      if: inputs.app-client-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
        # GitHub refuses a ref made by an App, such as the tag of a release,
        # whose commits carry workflow files unless the token may write them.
        permission-workflows: write
