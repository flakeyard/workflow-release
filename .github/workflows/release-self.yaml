# Releases this repository with its own product workflow.
name: release-self

on:
  push:
    branches: [main, "release/v[1-9]*"]

permissions: {}

jobs:
  release:
    uses: $/.github/workflows/release.yaml
    # Required by the called workflow for every path; with the App, its token
    # does the writes.
    permissions:
      contents: write # releases and tags without an App
      issues: write # release-please labels
      pull-requests: write # the release pull request
      actions: write # dispatched checks without an App
    with:
      app-client-id: ${{ vars.BOT_CLIENT_ID }}
      environment: release
      # The environment requires the owner's approval; release pull requests
      # are opened with GITHUB_TOKEN, so that only releases wait for it.
      app-pull-requests: false
      # Release pull requests opened with GITHUB_TOKEN start no workflows.
      check-workflow: test.yaml
      move-major-tag: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
