# CI of this repository: the unit tests of the action scripts and the static
# tests of the workflows, then workflow-check.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The library that the scripts source, at the commit that release.yaml
      # pins.
      - id: lib
        uses: flakeyard/action-shell-lib@f49e13a81812082d44a37a1b585f8a69edb76d83 # v0.1.3
      # The static tests of the workflows use the runner's mikefarah yq.
      - env:
          SHELL_LIB: ${{ steps.lib.outputs.path }}
        run: tests/run.sh

  check:
    needs: [unit]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@be573996bc498dae2785bb0087e52cea34ae1b20 # v0.2.0
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      # The repository has no flake yet.
      flake: ""
      renovate-presets: '["flakeyard/renovate-config"]'
