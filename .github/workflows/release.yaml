# Reusable release workflow: releases with release-please, keeps the latest
# release and the moving major tag in sync, and maintains the release pull
# request. Each step's logic lives in .github/actions.
name: release

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of a GitHub App to act as. Empty uses GITHUB_TOKEN.
        type: string
        default: ""
      environment:
        description: Environment that holds the secret APP_PRIVATE_KEY.
        type: string
        default: ""
      move-major-tag:
        description: Keep the tag vX at the latest release vX.Y.Z.
        type: boolean
        default: false
      check-workflow:
        description: >-
          Check workflow to start on the release pull request when no App is
          used, such as check.yaml.
        type: string
        default: ""
      config-file:
        description: release-please configuration file.
        type: string
        default: release-please-config.json
      manifest-file:
        description: release-please manifest file.
        type: string
        default: .release-please-manifest.json
    secrets:
      APP_PRIVATE_KEY:
        description: Private key of the App given by app-client-id.
        required: false
    outputs:
      released:
        description: "'true' when this run's commit is a published release."
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['released'] }}
      tag:
        description: Release tag, such as v1.2.3.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['tag'] }}
      version:
        description: Released version, such as 1.2.3.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['version'] }}
      major:
        description: Major version of the release.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['major'] }}
      minor:
        description: Minor version of the release.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['minor'] }}
      patch:
        description: Patch version of the release.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['patch'] }}
      prerelease:
        description: "'true' when the release is a pre-release (0.y.z)."
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['prerelease'] }}
      sha:
        description: Commit of the release; build published artifacts from it.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['sha'] }}
      release-url:
        description: URL of the GitHub release.
        value: ${{ fromJSON(jobs.release.outputs.state || '{}')['release-url'] }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: flakeyard-release-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # releases and tags with GITHUB_TOKEN
      issues: write # release-please labels
      pull-requests: write # release-please comments on the merged pull request
    outputs:
      checked: ${{ steps.preflight.outcome == 'success' }}
      state: ${{ steps.state.outputs.state }}
      elsewhere-tag: ${{ steps.state.outputs.elsewhere-tag }}
      elsewhere-sha: ${{ steps.state.outputs.elsewhere-sha }}
      elsewhere-created: ${{ steps.state.outputs.elsewhere-created }}
    steps:
      - id: preflight
        uses: $/.github/actions/preflight
        with:
          app-client-id: ${{ inputs.app-client-id }}
          has-key: ${{ secrets.APP_PRIVATE_KEY != '' }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - id: token
        uses: $/.github/actions/token
        with:
          app-client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: $/.github/actions/reconcile-pending-prs
        with:
          token: ${{ steps.token.outputs.token }}
          manifest-file: ${{ inputs.manifest-file }}

      # release-please can fail after creating a release: the steps after it
      # derive everything from the repository, and the job fails at the end.
      - id: rp
        name: Create releases
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

      - id: state
        uses: $/.github/actions/release-state
        with:
          token: ${{ steps.token.outputs.token }}
          manifest-file: ${{ inputs.manifest-file }}
          created: ${{ steps.rp.outputs.release_created }}
          created-tag: ${{ steps.rp.outputs.tag_name }}
          release-failed: ${{ steps.rp.outcome == 'failure' }}

      - if: startsWith(github.ref, 'refs/heads/release/')
        uses: $/.github/actions/keep-latest
        with:
          token: ${{ steps.token.outputs.token }}

      - if: inputs.move-major-tag
        uses: $/.github/actions/sync-major-tag
        with:
          token: ${{ steps.token.outputs.token }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Fail if release-please failed
        if: steps.rp.outcome == 'failure'
        run: |
          echo "::error::release-please failed; outputs and tags were synced. Rerun to retry."
          exit 1

  # A run that waited in the queue can release an older commit. The run of
  # that commit publishes it, so that attestations name the release commit.
  rerun-release-commit:
    name: Publish at the release commit
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.elsewhere-tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write # rerun the run of the release commit
      contents: read # read the release
    steps:
      - uses: $/.github/actions/rerun-release-commit
        with:
          tag: ${{ needs.release.outputs.elsewhere-tag }}
          sha: ${{ needs.release.outputs.elsewhere-sha }}
          created: ${{ needs.release.outputs.elsewhere-created }}

  pull-request:
    name: Release pull request
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.checked == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The key is needed, but this job deploys nothing; the branch policy of
    # the environment still applies.
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    concurrency:
      group: flakeyard-release-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # the release branch, with GITHUB_TOKEN
      issues: write # labels
      pull-requests: write # the release pull request
    steps:
      - id: token
        uses: $/.github/actions/token
        with:
          app-client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: $/.github/actions/release-pr
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  dispatch-checks:
    name: Start checks
    needs: [release, pull-request]
    if: >-
      ${{ !cancelled() && needs.release.outputs.checked == 'true'
      && inputs.app-client-id == '' && inputs.check-workflow != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start the check workflow
      pull-requests: read # find the release pull request
    steps:
      - uses: $/.github/actions/dispatch-checks
        with:
          check-workflow: ${{ inputs.check-workflow }}
